[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civictrack-backend"
version = "1.0.0"
description = "CivicTrack API - Community Problem Reporting and Resolution Platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.32",
    # Validation / settings
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    # ORM / database
    "sqlalchemy>=2.0.30,<2.1",
    "pymysql>=1.1.1,<2",
    "alembic>=1.13.0,<2",
    # Auth / HTTP
    "PyJWT>=2.8.0,<3",
    "bcrypt>=4.1.3,<5",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0,<0.28",
    # Images / scheduling
    "Pillow>=10.3.0,<11",
    "APScheduler>=3.10.4,<4",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "pytest-cov>=5.0.0,<6",
    "ruff>=0.6.0,<1",
    "mypy>=1.10.0,<2",
    "pre-commit>=3.7.0,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # bandit
    "N",   # pep8-naming
    "ANN", # type annotations
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any) are allowed at boundaries
    "B008",    # FastAPI dependency calls in defaults
    "E501",    # long comments / API descriptions are acceptable
    "S101",    # asserts are allowed in tests (also ignored per-test below)
    "N818",    # AppError hierarchy uses HTTP error names from TRD §2.6
    "S105",    # seed password and defaults
    "S106",    # token_type string literals
]
per-file-ignores = { "tests/**/*.py" = ["ANN", "S"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
