services:
  # ------------------------------- Database ---------------------------------
  db:
    image: mysql:8.4
    container_name: civictrack_db
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-storage-engine=InnoDB
      --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-civictrack}
      MYSQL_USER: ${MYSQL_USER:-civictrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - civictrack_db:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - civictrack_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------- Migration job (19.3) ----------------------------
  # One-shot: runs `alembic upgrade head` after MySQL is healthy. API/worker
  # gate on `service_completed_successfully` so a failing migration stops the
  # stack immediately (DEP-007: failure visibility).
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civictrack_migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - civictrack_net

  # ------------------------------ Demo seed ---------------------------------
  # One-shot, gated behind the `seed` profile: `docker compose --profile seed run --rm seed`.
  # Seed itself is idempotent, so re-running it is safe.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civictrack_seed
    restart: "no"
    profiles: ["seed"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.seed"]
    networks:
      - civictrack_net

  # --------------------------------- API ------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civictrack_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RUN_MIGRATIONS: "true"
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - civictrack_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Entrypoint runs migrations (RUN_MIGRATIONS=true) then execs the image CMD:
    #   uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  # ------------------------------- Worker -----------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civictrack_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RUN_MIGRATIONS: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - civictrack_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "-m", "app.worker"]

  # ---------------------------- Web (nginx SPA) -----------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_ENABLE_AI: ${VITE_ENABLE_AI:-false}
        VITE_ENABLE_MAP: ${VITE_ENABLE_MAP:-false}
        VITE_ENABLE_FEEDBACK: ${VITE_ENABLE_FEEDBACK:-false}
        VITE_ALLOW_DEMO_ESCALATION: ${VITE_ALLOW_DEMO_ESCALATION:-false}
    container_name: civictrack_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - civictrack_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  civictrack_db:
    name: civictrack_db
    driver: local
  uploads:
    name: civictrack_uploads
    driver: local

networks:
  civictrack_net:
    driver: bridge
